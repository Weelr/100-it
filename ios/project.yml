name: HundredIt
options:
  bundleIdPrefix: com.weelr
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
targets:
  HundredIt:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weelr.hundredit
        PRODUCT_NAME: HundredIt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "100% it"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "100% it"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "To scan the QR code from 100% it on your computer."
        CFBundleURLTypes:
          - CFBundleURLName: com.weelr.hundredit
            CFBundleURLSchemes: [hundredit]
        ALTAppGroups: [group.com.weelr.hundredit]
    dependencies:
      - target: HundredItWidget
  HundredItWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weelr.hundredit.widget
        PRODUCT_NAME: HundredItWidget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "100% it"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ALTAppGroups: [group.com.weelr.hundredit]
