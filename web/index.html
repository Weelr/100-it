<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1813">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="100% it">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>100% it</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="icon.svg" alt="" class="logo">
    <div>
      <h1>100% it</h1>
      <p data-i="subtitle" class="pc-only"></p>
      <button id="syncInfo" class="sync-info remote-only" data-action="phoneRefresh"></button>
    </div>
  </div>
  <div class="row">
    <button id="sessionBtn" class="ghost hidden" data-action="session">
      <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 9h6M9 13h6M9 17h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span data-i="sessionBtn"></span></button>
    <button id="miniBtn" class="ghost hidden" data-action="mini">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor"/></svg>
      <span data-i="miniBtn"></span></button>
    <button id="allBtn" class="ghost hidden" data-action="toggleAll"></button>
    <button id="langBtn" class="ghost" data-action="lang"></button>
    <button class="ghost" data-action="settings" data-i-title="settings">
      <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm7.4-2.5.1-1-.1-1 2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L15 3h-4l-.4 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11l-.1 1 .1 1-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.5c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4-2-1.6Z"/></svg>
    </button>
  </div>
</header>

<main>
  <section id="empty" class="empty hidden">
    <img src="icon.svg" alt="" class="empty-logo">
    <h2 data-i="whereSaves"></h2>
    <p data-i-html="whereSavesHelp"></p>
    <div class="row center">
      <button class="primary" data-action="browse" data-i="pickFolder"></button>
      <button class="ghost" data-action="detect" data-i="autoFind"></button>
    </div>
    <p id="emptyMsg" class="muted"></p>
  </section>

  <section id="miniView" class="mini-view hidden"></section>
  <section id="phoneApp" class="phone-app hidden"></section>

  <section id="main" class="hidden">
    <div id="slotsGrid" class="slots-grid hidden"></div>

    <section class="hero">
      <div class="save-card" id="saveCard"></div>
      <div class="hero-side">
        <div class="ring-wrap">
          <svg viewBox="0 0 120 120" class="ring">
            <circle cx="60" cy="60" r="52" class="ring-bg"/>
            <circle cx="60" cy="60" r="52" class="ring-fg" id="ringFg"/>
          </svg>
          <div class="ring-text"><span id="overallPct">0</span><small>%</small><em id="ringLabel"></em></div>
        </div>
        <button class="here-card hidden" id="hereCard"></button>
      </div>
    </section>

    <div class="tiles" id="tiles"></div>
    <section id="nextUp" class="next-up hidden"></section>

    <div class="toolbar">
      <nav class="tabs" id="tabs">
        <button data-tab="field" class="on" data-i="tabField"></button>
        <button data-tab="dungeon" data-i="tabDungeon"></button>
        <button data-tab="gear" data-i="tabGear"></button>
        <button data-tab="songs" data-i="tabSongs"></button>
        <button data-tab="history" id="historyTab" data-i="tabHistory"></button>
        <button data-tab="hours" data-i="tabHours"></button>
      </nav>
      <div class="tools">
        <div class="search hidden" id="searchBox">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="searchInput" type="search" autocomplete="off" spellcheck="false" data-i-ph="searchPh">
          <div class="search-results hidden" id="searchResults"></div>
        </div>
        <button class="sort-btn" id="sortBtn" data-action="sort" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M7 4v14m0 0-3-3m3 3 3-3M14 6h7M14 11h5M14 16h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i="sortPct"></span><i class="switch"></i>
        </button>
        <div class="age-switch" id="ageSwitch" role="radiogroup">
          <button data-age="child" data-i="ageChild"></button>
          <button data-age="adult" data-i="ageAdult"></button>
          <button data-age="both" data-i="ageBoth"></button>
        </div>
      </div>
    </div>
    <div id="view"></div>
  </section>
</main>

<div id="drawer" class="drawer hidden" role="dialog">
  <div class="drawer-card">
    <header>
      <div>
        <h3 id="drTitle"></h3>
        <p id="drSub" class="muted"></p>
      </div>
      <button class="ghost close" data-action="close">✕</button>
    </header>
    <div class="drawer-bar"><div id="drBar"></div></div>
    <div id="drBody"></div>
  </div>
</div>

<div id="settings" class="drawer hidden" role="dialog">
  <div class="drawer-card narrow">
    <header>
      <h3 data-i="settings"></h3>
      <button class="ghost close" data-action="close">✕</button>
    </header>
    <div class="pc-only">
    <label class="field"><span data-i="saveFolder"></span>
      <div class="row">
        <input id="dirInput" dir="ltr" spellcheck="false">
        <button class="ghost" data-action="browse" data-i="browse"></button>
      </div>
    </label>
    <div class="row">
      <button class="primary" data-action="saveDir" data-i="save"></button>
      <button class="ghost" data-action="detect" data-i="autoFind"></button>
    </div>
    <p id="settingsMsg" class="muted"></p>
    <p id="versionInfo" class="muted small"></p>
    <div class="field"><span data-i="phoneTitle"></span><div id="phoneBox" class="phone-box"></div></div>
    </div>
    <div class="field remote-only" id="phoneAppBox"></div>
    <div class="field"><span data-i="features"></span>
      <div class="feature-list" id="featureList"></div>
    </div>
    <div class="field"><span data-i="language"></span>
      <div class="age-switch" id="langSwitch">
        <button data-lang="ar">العربية</button>
        <button data-lang="en">English</button>
      </div>
    </div>
  </div>
</div>

<div id="missingModal" class="drawer hidden" role="dialog">
  <div class="drawer-card narrow missing-card">
    <header>
      <div><h3 id="msTitle"></h3><p id="msSub" class="muted"></p></div>
      <button class="ghost close" data-action="close">✕</button>
    </header>
    <div id="msBody"></div>
  </div>
</div>

<div id="sessionModal" class="drawer hidden" role="dialog">
  <div class="drawer-card narrow">
    <header>
      <div><h3 id="sesTitle"></h3><p id="sesSub" class="muted"></p></div>
      <button class="ghost close" data-action="close">✕</button>
    </header>
    <div id="sesBody"></div>
  </div>
</div>

<div id="gameModal" class="drawer hidden" role="dialog">
  <div class="drawer-card narrow game-editor">
    <header>
      <h3 id="gmTitle"></h3>
      <button class="ghost close" data-action="close">✕</button>
    </header>
    <div id="gmBody"></div>
  </div>
</div>

<div id="updateCard" class="update-card hidden" role="status"></div>
<div id="toast" class="toast hidden"></div>
<div id="notes" class="notes"></div>
<script src="qr.js"></script>
<script src="remote.js"></script>
<script src="app.js"></script>
<script src="features.js"></script>
<script src="phone.js"></script>
</body>
</html>
