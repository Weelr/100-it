name: build

# Runs on every push to main, or by hand: Actions > build > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels an older build still running, so an old build can't
# finish last and overwrite the phone page or the latest release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main always holds a single commit: each update replaces the one before.
  # If a push left main with more than one commit, fold it back into one
  # (same files, same message), authored with the GitHub no-reply address.
  squash:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.s.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: s
        name: Keep main as one commit
        run: |
          SHA="$GITHUB_SHA"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && git rev-parse -q --verify HEAD^ >/dev/null; then
            export GIT_AUTHOR_NAME=Weelr GIT_AUTHOR_EMAIL=Weelr@users.noreply.github.com
            export GIT_COMMITTER_NAME=Weelr GIT_COMMITTER_EMAIL=Weelr@users.noreply.github.com
            NEW=$(git log -1 --format=%B HEAD | git commit-tree "HEAD^{tree}")
            if git push --force-with-lease=main:"$GITHUB_SHA" origin "$NEW:refs/heads/main"; then
              SHA="$NEW"; echo "main is now one commit: $NEW"
            else
              echo "::warning::Could not fold main into one commit; it will be done on the next update."
            fi
          else
            echo "main is already one commit"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  windows:
    needs: squash
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.squash.outputs.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish single exe
        run: >
          dotnet publish app/HundredIt.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=2.1.${{ github.run_number }} -o dist
      - name: Self-test (opens the real window on a sample save)
        shell: pwsh
        run: |
          $p = Start-Process dist/100it.exe -ArgumentList '--selftest', "$PWD\tests\fixture", "$PWD\selftest" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "app did not exit" }
          Get-ChildItem selftest | Format-Table Name, Length
          if (Test-Path selftest/error.txt) { Get-Content selftest/error.txt; throw "self-test failed" }
          Get-Content selftest/js-errors.txt
          $s = Get-Content selftest/state.json -Raw | ConvertFrom-Json
          $s.slots | ForEach-Object { "{0}: {1} done, {2} tokens, {3}" -f $_.key, $_.done.Count, $_.gsCount, $_.location }
          $t = $s.slots[0]
          if ($s.slots.Count -ne 1 -or $t.done.Count -ne 8 -or $t.gsCount -ne 3 -or $t.location -ne "KakarikoVillage" -or -not $t.hasImage) { throw "unexpected state for the test save" }
          foreach ($f in 'shot.png', 'shot-region.png') {
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes("selftest/$f"))
            for ($i = 0; $i -lt $b.Length; $i += 3000) { "B64:${f}:" + $b.Substring($i, [Math]::Min(3000, $b.Length - $i)) }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: selftest
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: 100it-windows
          path: dist/100it.exe
          retention-days: 1
      - name: Carry over the iPhone app from the previous release
        # So the AltStore source keeps working until (or if) the iOS job replaces them.
        shell: pwsh
        run: |
          foreach ($f in 'altstore.json', '100it.ipa', 'ios-build.json') {
            try { Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/latest/download/$f" -OutFile "dist/$f" } catch { "no $f yet" }
          }
      - name: Publish as the latest release (the app updates itself from this)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          target_commitish: ${{ needs.squash.outputs.sha }}
          name: 100% it 2.1.${{ github.run_number }}
          files: |
            dist/100it.exe
            dist/altstore.json
            dist/100it.ipa
            dist/ios-build.json
          make_latest: true

  # The phone page: the same UI, reading your progress from the gist the app keeps
  # up to date. Served by GitHub Pages from the "gh-pages" branch (always one commit):
  # https://weelr.github.io/100-it/
  phone-page:
    needs: squash
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.squash.outputs.sha }}
      - name: Put web/ on the "gh-pages" branch
        run: |
          cd web
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "phone page"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      - name: Turn on GitHub Pages (if it isn't already)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1 && echo "Pages already on" && exit 0
          gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" \
            || echo "::warning::Turn on Pages once: Settings > Pages > Deploy from a branch > gh-pages / (root)"

  # iPhone app (install with AltStore / SideStore). Unsigned build; AltStore signs
  # it with your Apple ID. Download: releases/latest/download/100it.ipa
  ios:
    needs: [squash, windows]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.squash.outputs.sha }}
      - name: Build 100it.ipa (only when something in ios/ changed)
        run: |
          set -eo pipefail
          # The app's version only goes up when ios/ changed, so AltStore offers an
          # update only when there's a real one. ios-build.json (kept in the release)
          # remembers the last version number and which ios/ it was built from.
          # (Build numbers start at 100: the first test build was build 24.)
          LATEST="https://github.com/${{ github.repository }}/releases/latest/download"
          TREE=$(git rev-parse HEAD:ios)
          curl -fsSL "$LATEST/ios-build.json" -o prev.json || echo '{"n": 6, "tree": ""}' > prev.json
          PN=$(python3 -c 'import json; print(json.load(open("prev.json"))["n"])')
          PT=$(python3 -c 'import json; print(json.load(open("prev.json"))["tree"])')
          if [ "$TREE" = "$PT" ] && curl -fsSL "$LATEST/100it.ipa" -o 100it.ipa; then
            N=$PN; B=$((100 + N))
            echo "ios/ unchanged: keeping the iPhone app at 1.$N ($B)"
          else
            N=$((PN + 1)); B=$((100 + N))
            echo "Building the iPhone app 1.$N ($B)"
            brew install xcodegen >/dev/null
            cd ios
            sed -i '' "s/MARKETING_VERSION: \"1.0\"/MARKETING_VERSION: \"1.$N\"/; s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$B\"/" project.yml
            xcodegen generate
            xcodebuild -project HundredIt.xcodeproj -target HundredIt -configuration Release -sdk iphoneos \
              SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
            grep -q "BUILD SUCCEEDED" build.log
            APP=build/Release-iphoneos/HundredIt.app
            # Ad-hoc sign with the app-group entitlement so AltStore knows to set it up.
            codesign -f -s - --entitlements Widget/Widget.entitlements "$APP/PlugIns/HundredItWidget.appex"
            codesign -f -s - --entitlements App/App.entitlements "$APP"
            mkdir Payload && cp -R "$APP" Payload/
            zip -qry ../100it.ipa Payload
            cd ..
          fi
          ls -la 100it.ipa
          printf '{"n": %s, "tree": "%s"}\n' "$N" "$TREE" > ios-build.json
          echo "IOS_BUILD=$N" >> "$GITHUB_ENV"
          echo "IOS_BUILDNUM=$B" >> "$GITHUB_ENV"
      - name: Keep the build log for debugging (1 day)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log
          retention-days: 1
      - name: AltStore source (so AltStore shows updates)
        run: python3 ios/altstore_source.py "$IOS_BUILD" "v2.1.${{ github.run_number }}" 100it.ipa "$IOS_BUILDNUM" > altstore.json
      - uses: actions/upload-artifact@v4
        with:
          name: 100it-ios
          path: |
            100it.ipa
            altstore.json
          retention-days: 1
      - name: Add the app to the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          files: |
            100it.ipa
            altstore.json
            ios-build.json

  # Only the newest build is kept: older releases, tags and builds (with their
  # files) are deleted once this one is published.
  cleanup:
    needs: [windows, phone-page, ios]
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      KEEP: v2.1.${{ github.run_number }}
    steps:
      - name: Keep only the latest release and its tag
        run: |
          gh release list --limit 500 --json tagName -q '.[].tagName' | while read -r t; do
            [ "$t" = "$KEEP" ] || gh release delete "$t" --cleanup-tag -y || true
          done
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/" -q '.[].ref' | while read -r r; do
            [ "$r" = "refs/tags/$KEEP" ] || gh api -X DELETE "repos/$GH_REPO/git/$r" || true
          done
      - name: Delete older builds (and their files)
        run: |
          gh api --paginate "repos/$GH_REPO/actions/runs?per_page=100" \
            -q '.workflow_runs[] | select(.id != ${{ github.run_id }} and .status == "completed") | .id' |
          while read -r id; do gh api -X DELETE "repos/$GH_REPO/actions/runs/$id" >/dev/null || true; done
